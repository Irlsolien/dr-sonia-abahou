name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le workflow ne fait que lire le dépôt, installer et construire : le jeton
# n'a besoin d'aucun droit d'écriture. Déclaré explicitement plutôt que laissé
# au réglage par défaut du dépôt.
permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
